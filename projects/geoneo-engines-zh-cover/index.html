<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1440" />
    <title>Geoneo — 引擎在变（小红书封面）</title>
    <link rel="stylesheet" href="kit/fonts.css" />
    <link rel="stylesheet" href="kit/vendor/fonts/noto-sans-sc-500.css" />
    <link rel="stylesheet" href="kit/vendor/fonts/noto-sans-sc-700.css" />
    <link rel="stylesheet" href="kit/pixel-crew.css" />
    <link rel="stylesheet" href="kit/brands/geoneo/brand.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/sprites.js"></script>
    <script src="kit/brand.js"></script>
    <script src="kit/brands/geoneo/logo.js"></script>
    <script src="kit/motion.js"></script>
    <script src="slides.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1440" data-fps="30" data-duration="1">
      <div class="geo-bg"></div>
      <span class="geo-logo" id="logo" data-logo></span>
      <div class="geo-kicker" id="kick">每隔几个月的头条</div>
      <h1 class="geo-h1" id="title">
        <div>每出一个新AI引擎，</div>
        <div>旧的可见度打法</div>
        <div>就被<em>&ldquo;终结&rdquo;</em>一次。</div>
      </h1>
      <span id="alleged">（据说）</span>
      <div id="chips"></div>
      <div class="geo-card" id="book">
        <div class="geo-kicker">旧的做法</div>
        <h4>可见度打法</h4>
        <div class="skel-rows"><span class="geo-skel" style="width: 92%"></span><span class="geo-skel" style="width: 74%"></span><span class="geo-skel" style="width: 84%"></span></div>
        <div class="tags"><span class="geo-chip">关键词</span><span class="geo-chip">外链</span><span class="geo-chip">排名</span></div>
      </div>
      <div id="rip">R.I.P.</div>
      <div id="host"><div class="flip" data-presenter></div></div>
    </div>
    <script>
      // the engines from the reel's parade, same robot colours
      const css = getComputedStyle(document.documentElement);
      const C = { teal: css.getPropertyValue("--geo-teal").trim(), blue: css.getPropertyValue("--geo-blue").trim(), grey: css.getPropertyValue("--geo-grey").trim() };
      const ENGINES = [["ChatGPT", "teal"], ["Perplexity", "blue"], ["AI概览", "grey"], ["Gemini", "teal"], ["Copilot", "blue"], ["DeepSeek", "grey"], ["通义千问", "teal"], ["Kimi", "blue"]];
      document.getElementById("chips").innerHTML =
        ENGINES.map(([name, c]) => `<span class="geo-chip"><span class="robot">${Sprites.robot(C[c], { variant: "flat", px: 3 })}</span>${name}</span>`).join("") +
        `<span class="geo-chip is-next">下个月？</span>`;
      document.querySelectorAll("[data-logo]").forEach((el) => (el.innerHTML = window.GEONEO_LOGO));
      Sprites.hydrate(document);
      const zh = document.body.innerText;
      const fonts = ["700 96px 'Inter Tight'", "500 22px 'IBM Plex Mono'", "500 22px Inter"].map((f) => document.fonts.load(f)).concat(["500 30px 'Noto Sans SC'", "700 100px 'Noto Sans SC'"].map((f) => document.fonts.load(f, zh)));
      Promise.all([...fonts, window.AVATAR_READY]).then(() => {
        const R = Reel.create({ timing: { total: 1, scenes: [] } });
        R.register();
        window.__timelines["main"] = R.tl;
      });
    </script>
  </body>
</html>
