<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"slide","type":"number","label":"Slide","default":1,"min":1,"max":10,"step":1}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>AI Meta Ads Team — carousel slide</title>
    <link rel="stylesheet" href="kit/fonts.css" />
    <link rel="stylesheet" href="kit/pixel-crew.css" />
    <link rel="stylesheet" href="kit/carousel.css" />
    <style>
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/sprites.js"></script>
    <script src="kit/brand.js"></script>
    <script src="kit/motion.js"></script>
    <script src="slides.js"></script>
    <script src="slide.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1350" data-fps="30" data-duration="6">
      <div class="cz" id="slide"></div>
    </div>
    <script>
      // build once the fonts (titles are sized by measuring) and the host image are in, then register
      const fonts = ["900 100px Inter", "700 24px 'JetBrains Mono'", "800 24px 'JetBrains Mono'", "700 46px Caveat"].map((f) => document.fonts.load(f));
      Promise.all([...fonts, window.AVATAR_READY]).then(() => {
        const R = window.buildSlide(document.getElementById("slide"));
        window.__timelines["main"] = R.tl;
      });
    </script>
  </body>
</html>
