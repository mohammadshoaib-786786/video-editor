<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Avatar preview</title>
    <link rel="stylesheet" href="kit/fonts.css" />
    <link rel="stylesheet" href="kit/pixel-crew.css" />
    <style>
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .full {
        position: absolute;
        left: 20px;
        top: 560px;
        width: 760px;
      }
      .ring {
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        padding: 12px;
        background: conic-gradient(#f9b234, #e4483f, #b13bd6, #4b62f0, #f9b234);
      }
      .ring > div {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 6px solid #fff;
        background: #c9d4fb;
      }
      .ring svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .label {
        position: absolute;
        font: 800 24px var(--f-mono);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .profile {
        position: absolute;
        left: 470px;
        top: 250px;
        width: 560px;
        height: 150px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 26px;
      }
      .profile .face {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 5px solid var(--ink);
        overflow: hidden;
        background: #c9d4fb;
        flex: none;
      }
      .profile .face svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .profile b {
        font: 850 40px var(--f-body);
        letter-spacing: -0.02em;
      }
      .yes {
        position: absolute;
        left: 470px;
        top: 440px;
        width: 560px;
        height: 170px;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 26px;
      }
      .yes span {
        font: 800 20px var(--f-mono);
        letter-spacing: 0.16em;
        color: var(--ink-2);
        text-transform: uppercase;
      }
      .yes b {
        display: block;
        font: 850 42px var(--f-body);
      }
    </style>
    <script src="kit/vendor/gsap.min.js"></script>
    <script src="kit/sprites.js"></script>
    <script src="kit/brand.js"></script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1350" data-duration="2">
      <div class="bg is-paper"><div class="doodles" data-seed="12" data-count="10"></div></div>
      <h1 class="title" style="position: absolute; left: 0; right: 0; top: 56px; --size: 84px; --accent: var(--r1)">Your cartoon</h1>
      <div class="full" id="full"></div>
      <span class="label" style="left: 120px; top: 210px">Avatar</span>
      <div class="ring" style="left: 120px; top: 260px; width: 260px; height: 260px"><div id="ring"></div></div>
      <span class="label" style="left: 470px; top: 210px">In the reels</span>
      <div class="card profile" style="--accent: var(--cobalt)"><div class="face" id="pf"></div><b>@yourhandle</b></div>
      <div class="card yes" style="--accent: var(--ink)">
        <div class="face" id="ap" style="width: 110px; height: 110px; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden; background: #c9d4fb; flex: none"></div>
        <div><span>Approver</span><b>You</b></div>
      </div>
    </div>
    <script>
      // shows the brand host from kit/brand.js (window.AVATAR)
      window.AVATAR_READY.then(() => {
        document.getElementById("full").innerHTML = Sprites.presenter();
        ["ring", "pf", "ap"].forEach((id) => (document.getElementById(id).innerHTML = Sprites.face()));
        Sprites.hydrate(document);
        const tl = gsap.timeline({ paused: true });
        tl.to("#full", { y: -4, duration: 2 }, 0);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
